name: Apply preview-safe threading

on:
  push:
    branches:
      - perf/render-pipeline-parity
    paths:
      - .github/workflows/apply-preview-threading.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/render-pipeline-parity
      - name: Apply preview-safe compositor threading
        run: python scripts/apply-preview-threading.py
      - name: Commit preview threading changes
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add src/engine/render/Renderer.cpp && git rm scripts/apply-preview-threading.py .github/workflows/apply-preview-threading.yml && git commit -m 'Thread dynamic compositing with lower previews' && git push origin HEAD:perf/render-pipeline-parity
