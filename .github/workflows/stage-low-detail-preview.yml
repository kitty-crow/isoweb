name: Stage low-detail preview renderer

on:
  push:
    branches: [fix/cheap-lower-preview-render]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cheap-lower-preview-render
      - name: Apply implementation
        run: python scripts/stage_low_detail_preview.py
      - name: Commit implementation and remove staging helpers
        run: |
          rm -f scripts/stage_low_detail_preview.py
          rm -f .github/workflows/stage-low-detail-preview.yml
          rm -f .github/workflows/fix-stage-low-detail-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render lower levels as cheap low-detail previews"
          git push origin HEAD:fix/cheap-lower-preview-render
