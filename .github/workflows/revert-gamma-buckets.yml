name: Restore exact gamma reference

on:
  push:
    branches:
      - perf/render-pipeline-parity
    paths:
      - .github/workflows/revert-gamma-buckets.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/render-pipeline-parity
      - name: Restore reference gamma conversion
        run: python scripts/revert-gamma-buckets.py
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/render/Renderer.cpp
          git rm scripts/revert-gamma-buckets.py .github/workflows/revert-gamma-buckets.yml
          git commit -m 'Restore exact reference gamma conversion'
          git push origin HEAD:perf/render-pipeline-parity
