name: Fix low-detail preview staging workflow

on:
  push:
    branches: [fix/cheap-lower-preview-render]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cheap-lower-preview-render
      - name: Fix Python shell declaration and remove helper
        run: |
          sed -i 's/^        shell: python$/        shell: python {0}/' .github/workflows/stage-low-detail-preview.yml
          rm .github/workflows/fix-stage-low-detail-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Fix low-detail preview staging workflow"
          git push origin HEAD:fix/cheap-lower-preview-render
