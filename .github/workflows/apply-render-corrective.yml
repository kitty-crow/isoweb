name: Apply render corrective patch

on:
  push:
    branches:
      - perf/render-pipeline-parity
    paths:
      - scripts/apply-render-corrective.py
      - scripts/render-performance-corrective.patch
      - .github/workflows/apply-render-corrective.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/render-pipeline-parity
          fetch-depth: 0
      - name: Apply exact source corrections
        run: |
          set -euo pipefail
          python scripts/apply-render-corrective.py
          rm scripts/apply-render-corrective.py
          rm scripts/render-performance-corrective.patch
          rm .github/workflows/apply-render-corrective.yml
          git diff --check
      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden WebGL render transfers"
          git push origin HEAD:perf/render-pipeline-parity
