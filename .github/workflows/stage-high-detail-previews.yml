name: Stage high-detail previews

on:
  push:
    branches: [perf/high-detail-progressive-previews]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/high-detail-progressive-previews
      - name: Apply preview quality rebalance
        run: python3 scripts/apply-high-detail-previews.py
      - name: Commit engine changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/render/Renderer.cpp src/demo/DemoWorld.cpp scripts/progressive-preview-smoke.ts
          git commit -m 'Raise progressive lower-preview detail'
          git push
