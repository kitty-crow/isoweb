name: Apply generic room feature

on:
  push:
    branches: [feat/generic-room-layouts-preview-stack]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply generic room feature'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply room feature transformation
        run: python3 scripts/apply-room-feature.py

      - name: Commit transformed source
        run: |
          rm scripts/apply-room-feature.py
          rm .github/workflows/apply-room-feature.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add generic room layouts and stacked level previews"
          git push
