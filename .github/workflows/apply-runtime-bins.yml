name: Apply runtime render bins

on:
  push:
    branches:
      - perf/render-pipeline-parity
    paths:
      - .github/workflows/apply-runtime-bins.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/render-pipeline-parity
      - name: Apply conservative runtime bins
        run: python scripts/apply-runtime-bins.py
      - name: Commit runtime bins
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add src/engine/world/World.hpp src/engine/world/World.cpp && git rm scripts/apply-runtime-bins.py .github/workflows/apply-runtime-bins.yml && git commit -m 'Add exact screen-space runtime render bins' && git push origin HEAD:perf/render-pipeline-parity
