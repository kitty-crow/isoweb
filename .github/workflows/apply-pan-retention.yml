name: Apply exact pan retention patch

on:
  push:
    branches:
      - fix/pan-retention-and-gpu-selection
    paths:
      - scripts/.apply-pan-retention

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pan-retention-and-gpu-selection
          fetch-depth: 0
      - name: Recover and apply staged patch
        shell: bash
        run: |
          git show 9c1daeeb7a5d90b7c5e971d2784ea4e7fbdbd8e9:.github/workflows/apply-pan-retention.yml > /tmp/original-workflow.yml
          python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/original-workflow.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-pan-retention.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/apply-pan-retention.py
      - name: Clean staging files and commit source
        shell: bash
        run: |
          rm -f scripts/.apply-pan-retention .github/workflows/apply-pan-retention.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retain exact scene state across camera pans"
          git push origin HEAD:fix/pan-retention-and-gpu-selection
