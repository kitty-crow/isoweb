name: Stage preview visibility fix

on:
  push:
    branches: [fix/full-detail-preview-character-overlay]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-detail-preview-character-overlay
      - name: Apply preview patch
        run: python3 scripts/apply-preview-visibility-fix.py
      - name: Commit engine changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/render/Renderer.cpp src/engine/world/World.cpp src/engine/world/World.hpp src/demo/DemoWorld.cpp scripts/progressive-preview-smoke.ts scripts/destination-feedback-smoke.cpp
          git commit -m 'Restore full-detail preview Characters and settled quality'
          git push
