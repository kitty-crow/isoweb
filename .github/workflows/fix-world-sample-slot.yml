name: Fix reference sampler worker slot

on:
  push:
    branches:
      - perf/render-pipeline-parity
    paths:
      - .github/workflows/fix-world-sample-slot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/render-pipeline-parity
      - name: Apply worker slot correction
        run: python scripts/fix-world-sample-slot.py
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/world/World.cpp
          git rm scripts/fix-world-sample-slot.py .github/workflows/fix-world-sample-slot.yml
          git commit -m 'Assign reference sampler scratch slot'
          git push origin HEAD:perf/render-pipeline-parity
