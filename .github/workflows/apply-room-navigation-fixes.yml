name: Apply room navigation fixes

on:
  push:
    branches: [feat/generic-room-layouts-preview-stack]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply room navigation fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply navigation and room-boundary fixes
        run: python3 scripts/fix-room-navigation.py
      - name: Commit final source
        run: |
          rm -f scripts/fix-room-navigation.py
          rm -f .github/workflows/optimise-room-boundaries.yml
          rm -f .github/workflows/apply-room-navigation-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix room navigation and boundary performance"
          git push
