name: Apply stair landing fix

on:
  push:
    branches: [feat/generic-room-layouts-preview-stack]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply stair landing fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Add safe floor landings around stair traversal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/demo/DemoWorld.cpp')
          s = p.read_text()
          old = '''constexpr float STAIR_HOLE_INSET = 0.015f;\n'''
          new = '''constexpr float STAIR_HOLE_INSET = 0.015f;\nconstexpr float STAIR_LANDING_MARGIN = 0.25f;\n'''
          if s.count(old) != 1:
              raise SystemExit(f'landing constant anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''  link.fromPosition = {connection.centreX, connection.lowY, 0.0f};\n  link.toPosition = {connection.centreX, connection.highY, 0.0f};\n'''
          new = '''  // Connector endpoints are floor landings outside the stair footprint.\n  // Keeping approach/arrival points off the first/last tread prevents runtime\n  // movement from entering a higher stair step sideways because its tick\n  // sampling phase differs slightly from the path planner's sampling phase.\n  link.fromPosition = {\n    connection.centreX,\n    connection.lowY - STAIR_LANDING_MARGIN,\n    0.0f\n  };\n  link.toPosition = {\n    connection.centreX,\n    connection.highY + STAIR_LANDING_MARGIN,\n    0.0f\n  };\n'''
          if s.count(old) != 1:
              raise SystemExit(f'navigation endpoint anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify stair routing before commit
        run: |
          bun run test:geometry
          bun run test:multilevel-routing
          bun run test:generic-multilevel-routing
      - name: Commit fix
        run: |
          rm .github/workflows/apply-stair-landing-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add safe stair landing endpoints"
          git push
