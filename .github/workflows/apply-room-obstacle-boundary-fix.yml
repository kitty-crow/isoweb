name: Apply room obstacle boundary fix

on:
  push:
    branches: [feat/generic-room-layouts-preview-stack]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply room obstacle boundary fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Keep mounted demo obstacles independent of structural room walls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/demo/DemoWorld.cpp')
          s = p.read_text()
          old = '''  bool overlapsAdditionalStatic(const Object& candidate) const override {\n    // Room boundaries are axis-aligned. Reject distant walls against the\n'''
          new = '''  bool overlapsAdditionalStatic(const Object& candidate) const override {\n    // Demo obstacle parts intentionally mount into or span past room boundary\n    // geometry. Their own authored motion defines their legal placement; room\n    // walls still collide normally with players and every other solid entity.\n    if (candidate.hasCollisionTag("demo-obstacle")) return false;\n\n    // Room boundaries are axis-aligned. Reject distant walls against the\n'''
          if s.count(old) != 1:
              raise SystemExit(f'boundary method anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify obstacle and navigation regressions
        run: |
          bun run test:obstacles
          bun run test:geometry
          bun run test:multilevel-routing
          bun run test:character-reliability
      - name: Commit fix
        run: |
          rm .github/workflows/apply-room-obstacle-boundary-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep demo obstacles independent of room boundaries"
          git push
