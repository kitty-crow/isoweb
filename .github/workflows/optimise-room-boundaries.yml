name: Optimise room boundary collision

on:
  push:
    branches: [feat/generic-room-layouts-preview-stack]

permissions:
  contents: write

jobs:
  optimise:
    if: github.event.head_commit.message == 'Optimise room boundary collision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add conservative boundary broad phase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/demo/DemoWorld.cpp')
          s = p.read_text()
          old = '''  bool overlapsAdditionalStatic(const Object& candidate) const override {
    for (const RoomWallBox& box : roomWalls_) {
      Object wall;
      wall.location = candidate.location;
      wall.location.position = {0.0f, 0.0f, 0.0f};
      wall.hitBox.minimum = box.centre - box.halfExtent;
      wall.hitBox.maximum = box.centre + box.halfExtent;
      wall.solid = true;
      if (wall.overlaps(candidate)) return true;
    }
    return false;
  }
'''
          new = '''  bool overlapsAdditionalStatic(const Object& candidate) const override {
    // Room boundaries are axis-aligned. Reject distant walls against the
    // candidate's conservative world AABB before paying for exact OBB SAT.
    // This matters for navigation, which samples collision many times while
    // searching a route through a multi-room level.
    Vec3 facing;
    Vec3 right;
    candidate.horizontalBasis(facing, right);
    const Vec3 localCentre = candidate.hitBox.centre();
    const Vec3 localHalf = (candidate.hitBox.maximum - candidate.hitBox.minimum) * 0.5f;
    const Vec3 candidateCentre = candidate.location.position +
      right * localCentre.x + facing * localCentre.y + Vec3(0.0f, 0.0f, localCentre.z);
    const Vec3 candidateHalf(
      std::fabs(right.x) * localHalf.x + std::fabs(facing.x) * localHalf.y,
      std::fabs(right.y) * localHalf.x + std::fabs(facing.y) * localHalf.y,
      localHalf.z
    );

    for (const RoomWallBox& box : roomWalls_) {
      if (
        std::fabs(candidateCentre.x - box.centre.x) >= candidateHalf.x + box.halfExtent.x ||
        std::fabs(candidateCentre.y - box.centre.y) >= candidateHalf.y + box.halfExtent.y ||
        std::fabs(candidateCentre.z - box.centre.z) >= candidateHalf.z + box.halfExtent.z
      ) {
        continue;
      }

      Object wall;
      wall.location = candidate.location;
      wall.location.position = {0.0f, 0.0f, 0.0f};
      wall.hitBox.minimum = box.centre - box.halfExtent;
      wall.hitBox.maximum = box.centre + box.halfExtent;
      wall.solid = true;
      if (wall.overlaps(candidate)) return true;
    }
    return false;
  }
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one collision method, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit optimisation
        run: |
          rm .github/workflows/optimise-room-boundaries.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Broad-phase room boundary collisions"
          git push
