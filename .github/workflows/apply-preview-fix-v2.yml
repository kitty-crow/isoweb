name: Apply preview runtime patch

on:
  push:
    branches:
      - feat/lower-preview-characters-feedback

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-preview-runtime-fix.py
      - name: Commit patched tree
        run: |
          rm scripts/apply-preview-runtime-fix.py
          rm .github/workflows/apply-preview-fix-v2.yml
          rm .github/workflows/apply-lower-preview-runtime-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Render lower preview Characters and fix expanded-view clipping"
          git push
