name: Apply exact static BVH

on:
  push:
    branches:
      - perf/render-pipeline-parity
    paths:
      - .github/workflows/apply-static-bvh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/render-pipeline-parity
      - name: Apply exact static BVH
        run: python scripts/apply-static-bvh.py
      - name: Commit static BVH
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add src/engine/world/RuntimeWorld.cpp && git rm scripts/apply-static-bvh.py .github/workflows/apply-static-bvh.yml && git commit -m 'Add exact static BVH acceleration' && git push origin HEAD:perf/render-pipeline-parity
