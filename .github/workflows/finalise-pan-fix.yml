name: Finalise pan fix

on:
  push:
    branches: [fix/pan-retention-and-gpu-selection]

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/pan-retention-and-gpu-selection
          fetch-depth: 0

      - name: Apply final parity regression
        run: python3 scripts/finalise-pan-fix.py

      - name: Remove temporary diagnostics
        run: |
          git show origin/main:.github/workflows/pages.yml > .github/workflows/pages.yml
          rm -f scripts/instrument-pan-diagnostic.py
          rm -f scripts/finalise-pan-fix.py
          rm -f .github/workflows/finalise-pan-fix.yml

      - name: Commit clean fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalise exact retained-pan parity regression"
          git push origin HEAD:fix/pan-retention-and-gpu-selection
