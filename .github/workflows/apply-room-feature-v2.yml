name: Apply generic room feature v2

on:
  push:
    branches: [feat/generic-room-layouts-preview-stack]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply generic room feature v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct transformation matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-room-feature.py')
          s = p.read_text()
          old = "  bool overlapsStatic(std::size_t objectIndex, const Object& candidate) const {\\n    if (objectIndex >= definition_.objects.size()) return false;"
          new = "  bool overlapsStatic(std::size_t objectIndex, const Object& candidate) const override {\\n    if (objectIndex >= definition_.objects.size()) return false;"
          if old not in s:
              raise SystemExit('expected matcher not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply room feature transformation
        run: python3 scripts/apply-room-feature.py

      - name: Commit transformed source
        run: |
          rm scripts/apply-room-feature.py
          rm .github/workflows/apply-room-feature.yml
          rm .github/workflows/apply-room-feature-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add generic room layouts and stacked level previews"
          git push
