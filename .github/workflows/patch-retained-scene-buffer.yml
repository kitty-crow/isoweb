name: Patch retained scene buffer

on:
  push:
    branches:
      - perf/render-pipeline-parity
    paths:
      - scripts/patch-retained-scene-buffer.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/render-pipeline-parity
          fetch-depth: 0
      - name: Apply clean retained-scene buffer fix
        run: python3 scripts/patch-retained-scene-buffer.py
      - name: Commit source correction and remove staging files
        run: |
          git config user.name "kitty"
          git config user.email "141717449+kitty-crow@users.noreply.github.com"
          git rm scripts/patch-retained-scene-buffer.py .github/workflows/patch-retained-scene-buffer.yml
          if [ -f .ci-render-trigger ]; then git rm .ci-render-trigger; fi
          git add src/engine/render/Renderer.cpp src/engine/render/Renderer.hpp
          git commit -m "Keep retained scene separate from control overlays"
          git push origin HEAD:perf/render-pipeline-parity
