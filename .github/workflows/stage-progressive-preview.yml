name: Stage progressive preview renderer

on:
  push:
    branches: [perf/progressive-preview-tiles]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/progressive-preview-tiles
      - name: Apply patch
        run: python3 scripts/apply-progressive-preview.py
      - name: Commit staged renderer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Render lower previews progressively and lazily'
          git push
