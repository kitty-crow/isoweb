name: Fix damage loop placement

on:
  push:
    branches:
      - perf/render-pipeline-parity
    paths:
      - .github/workflows/fix-damage-loop-placement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/render-pipeline-parity
      - name: Correct runtime damage loop placement
        run: python scripts/fix-damage-loop-placement.py
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/render/Renderer.cpp
          git rm scripts/fix-damage-loop-placement.py .github/workflows/fix-damage-loop-placement.yml
          git commit -m 'Correct exact damage loop placement'
          git push origin HEAD:perf/render-pipeline-parity
