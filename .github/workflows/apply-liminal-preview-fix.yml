name: Apply liminal preview compatibility fix

on:
  push:
    branches:
      - feat/lower-preview-characters-feedback

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compatibility patch
        run: python3 scripts/fix-liminal-preview.py
      - name: Commit patched tree
        run: |
          rm scripts/fix-liminal-preview.py
          rm .github/workflows/apply-liminal-preview-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep liminal projection separate from lower previews"
          git push
