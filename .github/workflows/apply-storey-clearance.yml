name: Apply storey height and clearance implementation

on:
  push:
    branches: [fix/storey-height-and-clearance]
    paths: [.github/workflows/apply-storey-clearance.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storey-height-and-clearance
      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}')
              p.write_text(text.replace(old, new, count))

          # Generic Object collision geometry may differ from authored/render geometry.
          replace(
              'src/engine/world/Object.hpp',
              '  HitBox hitBox;\n\n  // Surface textures are metadata today',
              '  HitBox hitBox;\n\n  // Runtime posture/deformation may use a different collision shape while the\n  // authored hitBox remains the stable standing/base geometry.\n  virtual HitBox collisionHitBox() const { return hitBox; }\n\n  // Surface textures are metadata today'
          )

          # Character crouch capability is explicitly configured per Character.
          replace(
              'src/engine/world/Character.hpp',
              '''  bool npc = false;\n  bool controllable = true;\n  float movementSpeedMultiplier = 1.0f;\n\n  bool moving = false;''',
              '''  bool npc = false;\n  bool controllable = true;\n  float movementSpeedMultiplier = 1.0f;\n\n  // Authored hitBox is always the standing shape. A positive crouchedHeight\n  // smaller than the standing height enables automatic low-clearance travel.\n  // Keeping this per Character avoids assuming every actor has the same body\n  // proportions or can crouch at all.\n  float crouchedHeight = 0.0f;\n  bool crouching = false;\n\n  float standingHeight() const {\n    return hitBox.maximum.z - hitBox.minimum.z;\n  }\n\n  bool canCrouch() const {\n    const float standing = standingHeight();\n    return crouchedHeight > 0.0f && crouchedHeight < standing;\n  }\n\n  HitBox effectiveHitBox() const {\n    HitBox result = hitBox;\n    if (crouching && canCrouch()) {\n      result.maximum.z = result.minimum.z + crouchedHeight;\n    }\n    return result;\n  }\n\n  HitBox collisionHitBox() const override { return effectiveHitBox(); }\n\n  bool moving = false;'''
          )

          # Allow movement planners to use a posture probe while ignoring the real entity.
          replace(
              'src/engine/world/World.hpp',
              '''    float maxStepUp,\n    float maxDrop,\n    Vec3& resolved\n  ) const;''',
              '''    float maxStepUp,\n    float maxDrop,\n    Vec3& resolved,\n    const Object* ignored = nullptr\n  ) const;'''
          )

          # Runtime rendering uses the effective posture hitbox.
          replace(
              'src/engine/world/World.cpp',
              '''    entry.proxy = renderProxy(*character, renderPosition, levelId);\n    entry.selected = characterSystem_ && characterSystem_->isSelected(character->id);''',
              '''    entry.proxy = renderProxy(*character, renderPosition, levelId);\n    entry.proxy.hitBox = character->effectiveHitBox();\n    entry.selected = characterSystem_ && characterSystem_->isSelected(character->id);'''
          )
          replace(
              'src/engine/world/World.cpp',
              '''        const Vec3 hitSize = character->hitBox.size();\n        const float defaultWidth = std::max(std::fabs(hitSize.x), std::fabs(hitSize.y));\n        const float defaultHeight = std::fabs(hitSize.z);''',
              '''        const HitBox renderHitBox = character->effectiveHitBox();\n        const Vec3 hitSize = renderHitBox.size();\n        const float defaultWidth = std::max(std::fabs(hitSize.x), std::fabs(hitSize.y));\n        const float defaultHeight = std::fabs(hitSize.z);'''
          )
          replace(
              'src/engine/world/World.cpp',
              '        const float bottom = renderPosition.z + character->hitBox.minimum.z;',
              '        const float bottom = renderPosition.z + renderHitBox.minimum.z;'
          )

          old_collision = '''bool World::collidesWith(const Object& candidate, const Object* ignored) const {\n  const std::string targetLevelId = candidate.location.levelId.empty()\n    ? activeLevelId()\n    : candidate.location.levelId;\n  const IWorldLevel& targetLevel = levelFor(targetLevelId);\n  const std::vector<Object>& staticObjects = targetLevel.objects();\n\n  for (std::size_t index = 0; index < staticObjects.size(); ++index) {\n    const Object& object = staticObjects[index];\n    const bool enabled = collisionPolicy_\n      ? collisionPolicy_->shouldCollide(object, candidate)\n      : object.collisionEnabledWith(candidate);\n    if (enabled && targetLevel.overlapsStatic(index, candidate)) return true;\n  }\n  if (targetLevel.overlapsAdditionalStatic(candidate)) return true;\n\n  for (const Object* object : entities_.all()) {\n    if (!object || object == ignored || object == &candidate) continue;\n    const bool enabled = collisionPolicy_\n      ? collisionPolicy_->shouldCollide(*object, candidate)\n      : object->collisionEnabledWith(candidate);\n    if (!enabled) continue;\n\n    const Object* overlapObject = object;\n    Object mappedProxy;\n    if (\n      !candidate.location.liminalObjectId.empty() &&\n      candidate.location.liminalObjectId == object->location.liminalObjectId &&\n      candidate.location.levelId != object->location.levelId\n    ) {\n      Vec3 mappedPosition;\n      if (mapLiminalPosition(object->location, targetLevelId, mappedPosition)) {\n        mappedProxy = renderProxy(*object, mappedPosition, targetLevelId);\n        overlapObject = &mappedProxy;\n      }\n    }\n\n    if (candidate.overlaps(*overlapObject)) return true;\n  }\n  return false;\n}'''
          new_collision = '''bool World::collidesWith(const Object& candidate, const Object* ignored) const {\n  const std::string targetLevelId = candidate.location.levelId.empty()\n    ? activeLevelId()\n    : candidate.location.levelId;\n  const IWorldLevel& targetLevel = levelFor(targetLevelId);\n  const std::vector<Object>& staticObjects = targetLevel.objects();\n\n  // The authored hitBox stays stable while posture can supply a smaller\n  // collision shape. Avoid copying ordinary objects on this hot path.\n  const HitBox candidateCollision = candidate.collisionHitBox();\n  const bool candidateAdjusted =\n    candidateCollision.minimum.x != candidate.hitBox.minimum.x ||\n    candidateCollision.minimum.y != candidate.hitBox.minimum.y ||\n    candidateCollision.minimum.z != candidate.hitBox.minimum.z ||\n    candidateCollision.maximum.x != candidate.hitBox.maximum.x ||\n    candidateCollision.maximum.y != candidate.hitBox.maximum.y ||\n    candidateCollision.maximum.z != candidate.hitBox.maximum.z;\n  Object candidateProxy;\n  const Object* collisionCandidate = &candidate;\n  if (candidateAdjusted) {\n    candidateProxy = candidate;\n    candidateProxy.hitBox = candidateCollision;\n    collisionCandidate = &candidateProxy;\n  }\n\n  for (std::size_t index = 0; index < staticObjects.size(); ++index) {\n    const Object& object = staticObjects[index];\n    const bool enabled = collisionPolicy_\n      ? collisionPolicy_->shouldCollide(object, candidate)\n      : object.collisionEnabledWith(candidate);\n    if (enabled && targetLevel.overlapsStatic(index, *collisionCandidate)) return true;\n  }\n  if (targetLevel.overlapsAdditionalStatic(*collisionCandidate)) return true;\n\n  for (const Object* object : entities_.all()) {\n    if (!object || object == ignored || object == &candidate) continue;\n    const bool enabled = collisionPolicy_\n      ? collisionPolicy_->shouldCollide(*object, candidate)\n      : object->collisionEnabledWith(candidate);\n    if (!enabled) continue;\n\n    const HitBox objectCollision = object->collisionHitBox();\n    const bool objectAdjusted =\n      objectCollision.minimum.x != object->hitBox.minimum.x ||\n      objectCollision.minimum.y != object->hitBox.minimum.y ||\n      objectCollision.minimum.z != object->hitBox.minimum.z ||\n      objectCollision.maximum.x != object->hitBox.maximum.x ||\n      objectCollision.maximum.y != object->hitBox.maximum.y ||\n      objectCollision.maximum.z != object->hitBox.maximum.z;\n    Object effectiveObjectProxy;\n    const Object* overlapObject = object;\n    if (objectAdjusted) {\n      effectiveObjectProxy = *object;\n      effectiveObjectProxy.hitBox = objectCollision;\n      overlapObject = &effectiveObjectProxy;\n    }\n\n    Object mappedProxy;\n    if (\n      !candidate.location.liminalObjectId.empty() &&\n      candidate.location.liminalObjectId == object->location.liminalObjectId &&\n      candidate.location.levelId != object->location.levelId\n    ) {\n      Vec3 mappedPosition;\n      if (mapLiminalPosition(object->location, targetLevelId, mappedPosition)) {\n        mappedProxy = renderProxy(*overlapObject, mappedPosition, targetLevelId);\n        overlapObject = &mappedProxy;\n      }\n    }\n\n    if (collisionCandidate->overlaps(*overlapObject)) return true;\n  }\n  return false;\n}'''
          replace('src/engine/world/World.cpp', old_collision, new_collision)

          old_resolve = '''bool World::resolveWalkablePosition(\n  const Object& object,\n  const std::string& levelId,\n  const Vec3& requested,\n  float referenceZ,\n  float maxStepUp,\n  float maxDrop,\n  Vec3& resolved\n) const {\n  if (!containsPosition(levelId, requested)) return false;\n\n  SceneSurfaceHit support;\n  if (!walkableSurfaceAt(levelId, requested.x, requested.y, support)) return false;\n\n  const float originZ = support.point.z - object.hitBox.minimum.z;\n  const float deltaZ = originZ - referenceZ;\n  if (deltaZ > maxStepUp + 1e-4f || deltaZ < -maxDrop - 1e-4f) return false;\n\n  Object probe = object;\n  probe.location.levelId = levelId;\n  probe.location.position = {requested.x, requested.y, originZ};\n  probe.location.liminalObjectId = liminalObjectAt(levelId, probe.location.position);\n  if (collidesWith(probe, &object)) return false;\n\n  resolved = probe.location.position;\n  return true;\n}'''
          new_resolve = '''bool World::resolveWalkablePosition(\n  const Object& object,\n  const std::string& levelId,\n  const Vec3& requested,\n  float referenceZ,\n  float maxStepUp,\n  float maxDrop,\n  Vec3& resolved,\n  const Object* ignored\n) const {\n  if (!containsPosition(levelId, requested)) return false;\n\n  SceneSurfaceHit support;\n  if (!walkableSurfaceAt(levelId, requested.x, requested.y, support)) return false;\n\n  const HitBox collisionHitBox = object.collisionHitBox();\n  const float originZ = support.point.z - collisionHitBox.minimum.z;\n  const float deltaZ = originZ - referenceZ;\n  if (deltaZ > maxStepUp + 1e-4f || deltaZ < -maxDrop - 1e-4f) return false;\n\n  Object probe = object;\n  probe.hitBox = collisionHitBox;\n  probe.location.levelId = levelId;\n  probe.location.position = {requested.x, requested.y, originZ};\n  probe.location.liminalObjectId = liminalObjectAt(levelId, probe.location.position);\n  if (collidesWith(probe, ignored ? ignored : &object)) return false;\n\n  resolved = probe.location.position;\n  return true;\n}'''
          replace('src/engine/world/World.cpp', old_resolve, new_resolve)

          # Planner checks standing first, then the Character's configured crouched height.
          old_support = '''bool positionBlocked(\n  const World& world,\n  const Character& character,\n  const std::string& levelId,\n  const Vec3& position,\n  const Vec3& facing\n) {\n  Character candidate = character;\n  candidate.location.levelId = levelId;\n  candidate.location.position = position;\n  candidate.forward = facing;\n  return world.collidesWith(candidate, &character);\n}\n\nbool resolveSupported(\n  const World& world,\n  const Character& character,\n  const std::string& levelId,\n  const Vec3& desired,\n  float referenceZ,\n  const Vec3& facing,\n  const CharacterEngineDefaults& defaults,\n  Vec3& resolved\n) {\n  if (!world.resolveWalkablePosition(\n    character,\n    levelId,\n    desired,\n    referenceZ,\n    defaults.maxStepHeight,\n    defaults.maxDropHeight,\n    resolved\n  )) {\n    return false;\n  }\n  return !positionBlocked(world, character, levelId, resolved, facing);\n}'''
          new_support = '''bool resolveSupportedWithLimits(\n  const World& world,\n  const Character& character,\n  const std::string& levelId,\n  const Vec3& desired,\n  float referenceZ,\n  const Vec3& facing,\n  float maxStepHeight,\n  float maxDropHeight,\n  Vec3& resolved,\n  bool* crouching = nullptr\n) {\n  const auto tryPosture = [&](bool useCrouch) {\n    Character probe = character;\n    probe.crouching = useCrouch;\n    probe.location.levelId = levelId;\n    probe.location.position = desired;\n    probe.forward = facing;\n    if (!world.resolveWalkablePosition(\n      probe,\n      levelId,\n      desired,\n      referenceZ,\n      maxStepHeight,\n      maxDropHeight,\n      resolved,\n      &character\n    )) {\n      return false;\n    }\n    if (crouching) *crouching = useCrouch;\n    return true;\n  };\n\n  if (tryPosture(false)) return true;\n  return character.canCrouch() && tryPosture(true);\n}\n\nbool resolveSupported(\n  const World& world,\n  const Character& character,\n  const std::string& levelId,\n  const Vec3& desired,\n  float referenceZ,\n  const Vec3& facing,\n  const CharacterEngineDefaults& defaults,\n  Vec3& resolved\n) {\n  return resolveSupportedWithLimits(\n    world,\n    character,\n    levelId,\n    desired,\n    referenceZ,\n    facing,\n    defaults.maxStepHeight,\n    defaults.maxDropHeight,\n    resolved\n  );\n}'''
          replace('src/engine/character/CharacterPolicies.cpp', old_support, new_support)

          old_destination = '''  const float unlimited = std::numeric_limits<float>::max() * 0.25f;\n  Vec3 supported;\n  if (world.resolveWalkablePosition(\n    character,\n    resolved.levelId,\n    resolved.position,\n    resolved.position.z,\n    unlimited,\n    unlimited,\n    supported\n  )) {\n    Character probe = character;\n    probe.location = resolved;\n    probe.location.position = supported;\n    if (!world.collidesWith(probe, &character)) {\n      resolved.position = supported;\n      return resolved;\n    }\n  }\n\n  const float step = std::max(0.08f, defaults.navigationCellSize);\n  const int rings = std::max(1, static_cast<int>(std::ceil(defaults.destinationSearchRadius / step)));\n  for (int ring = 1; ring <= rings; ++ring) {\n    const int radius = ring;\n    for (int x = -radius; x <= radius; ++x) {\n      for (int y = -radius; y <= radius; ++y) {\n        if (std::max(std::abs(x), std::abs(y)) != radius) continue;\n        Vec3 candidatePoint = requested.position + Vec3(x * step, y * step, 0.0f);\n        if (!world.resolveWalkablePosition(\n          character,\n          resolved.levelId,\n          candidatePoint,\n          candidatePoint.z,\n          unlimited,\n          unlimited,\n          supported\n        )) {\n          continue;\n        }\n\n        Character probe = character;\n        probe.location = resolved;\n        probe.location.position = supported;\n        if (!world.collidesWith(probe, &character)) {\n          resolved.position = supported;\n          return resolved;\n        }\n      }\n    }\n  }\n  return character.location;'''
          new_destination = '''  const float unlimited = std::numeric_limits<float>::max() * 0.25f;\n  Vec3 supported;\n  if (resolveSupportedWithLimits(\n    world,\n    character,\n    resolved.levelId,\n    resolved.position,\n    resolved.position.z,\n    character.forward,\n    unlimited,\n    unlimited,\n    supported\n  )) {\n    resolved.position = supported;\n    return resolved;\n  }\n\n  const float step = std::max(0.08f, defaults.navigationCellSize);\n  const int rings = std::max(1, static_cast<int>(std::ceil(defaults.destinationSearchRadius / step)));\n  for (int ring = 1; ring <= rings; ++ring) {\n    const int radius = ring;\n    for (int x = -radius; x <= radius; ++x) {\n      for (int y = -radius; y <= radius; ++y) {\n        if (std::max(std::abs(x), std::abs(y)) != radius) continue;\n        Vec3 candidatePoint = requested.position + Vec3(x * step, y * step, 0.0f);\n        if (!resolveSupportedWithLimits(\n          world,\n          character,\n          resolved.levelId,\n          candidatePoint,\n          candidatePoint.z,\n          character.forward,\n          unlimited,\n          unlimited,\n          supported\n        )) {\n          continue;\n        }\n        resolved.position = supported;\n        return resolved;\n      }\n    }\n  }\n  return character.location;'''
          replace('src/engine/character/CharacterPolicies.cpp', old_destination, new_destination)

          # Runtime movement reproduces the planner's standing-then-crouch clearance choice.
          replace(
              'src/engine/character/CharacterSystem.cpp',
              '''Object renderProxy(const Character& character, const Vec3& position, const std::string& levelId) {\n  Object proxy;\n  proxy.id = character.id;\n  proxy.location = character.location;\n  proxy.location.levelId = levelId;\n  proxy.location.position = position;\n  proxy.forward = character.forward;\n  proxy.hitBox = character.hitBox;\n  proxy.solid = character.solid;\n  return proxy;\n}''',
              '''Object renderProxy(const Character& character, const Vec3& position, const std::string& levelId) {\n  Object proxy;\n  proxy.id = character.id;\n  proxy.location = character.location;\n  proxy.location.levelId = levelId;\n  proxy.location.position = position;\n  proxy.forward = character.forward;\n  proxy.hitBox = character.effectiveHitBox();\n  proxy.solid = character.solid;\n  return proxy;\n}'''
          )

          anchor = '''Vec3 horizontalDirection(const Vec3& from, const Vec3& to, const Vec3& fallback) {\n  const Vec3 delta(to.x - from.x, to.y - from.y, 0.0f);\n  const float magnitudeSquared = delta.x * delta.x + delta.y * delta.y;\n  if (magnitudeSquared <= 1e-12f) return fallback;\n  return delta * (1.0f / std::sqrt(magnitudeSquared));\n}\n'''
          addition = anchor + '''\nbool resolveCharacterPosition(\n  World& world,\n  const Character& character,\n  const Vec3& desired,\n  float referenceZ,\n  const CharacterEngineDefaults& defaults,\n  Vec3& resolved,\n  bool& crouching\n) {\n  const auto tryPosture = [&](bool useCrouch) {\n    Character probe = character;\n    probe.crouching = useCrouch;\n    probe.location.position = desired;\n    if (!world.resolveWalkablePosition(\n      probe,\n      character.location.levelId,\n      desired,\n      referenceZ,\n      defaults.maxStepHeight,\n      defaults.maxDropHeight,\n      resolved,\n      &character\n    )) {\n      return false;\n    }\n    crouching = useCrouch;\n    return true;\n  };\n\n  if (tryPosture(false)) return true;\n  return character.canCrouch() && tryPosture(true);\n}\n\nbool standingFits(World& world, const Character& character) {\n  if (!character.crouching) return true;\n  Character standing = character;\n  standing.crouching = false;\n  return !world.collidesWith(standing, &character);\n}\n'''
          replace('src/engine/character/CharacterSystem.cpp', anchor, addition)

          replace(
              'src/engine/character/CharacterSystem.cpp',
              '''  if (distance <= 1e-6f) {\n    return world.resolveWalkablePosition(\n      character,\n      character.location.levelId,\n      destination,\n      start.z,\n      defaults.maxStepHeight,\n      defaults.maxDropHeight,\n      resolvedEnd\n    );\n  }''',
              '''  if (distance <= 1e-6f) {\n    bool crouching = false;\n    return resolveCharacterPosition(\n      world, character, destination, start.z, defaults, resolvedEnd, crouching\n    );\n  }'''
          )
          replace(
              'src/engine/character/CharacterSystem.cpp',
              '''    Vec3 supported;\n    if (!world.resolveWalkablePosition(\n      character,\n      character.location.levelId,\n      requested,\n      current.z,\n      defaults.maxStepHeight,\n      defaults.maxDropHeight,\n      supported\n    )) {\n      return false;\n    }\n    current = supported;''',
              '''    Vec3 supported;\n    bool crouching = false;\n    if (!resolveCharacterPosition(\n      world, character, requested, current.z, defaults, supported, crouching\n    )) {\n      return false;\n    }\n    current = supported;'''
          )

          replace(
              'src/engine/character/CharacterSystem.cpp',
              '''void CharacterSystem::stop(Character& character) {\n  character.movement.clear();\n  character.moving = false;\n}''',
              '''void CharacterSystem::stop(Character& character) {\n  character.movement.clear();\n  character.moving = false;\n  if (character.crouching && standingFits(world_, character)) character.crouching = false;\n}'''
          )
          replace(
              'src/engine/character/CharacterSystem.cpp',
              '''  if (!character.movement.hasDestination) {\n    character.moving = false;\n    return;\n  }''',
              '''  if (!character.movement.hasDestination) {\n    character.moving = false;\n    if (character.crouching && standingFits(world_, character)) character.crouching = false;\n    return;\n  }'''
          )

          reached = '''      character.location = character.movement.destination;\n      refreshLiminalMembership(world_, character, liminalTolerance);\n      character.movement.clear();\n      character.moving = false;\n      return;'''
          reached_new = '''      character.location = character.movement.destination;\n      refreshLiminalMembership(world_, character, liminalTolerance);\n      if (character.crouching && standingFits(world_, character)) character.crouching = false;\n      character.movement.clear();\n      character.moving = false;\n      return;'''
          replace('src/engine/character/CharacterSystem.cpp', reached, reached_new, count=2)

          old_snap = '''      Vec3 supported;\n      if (world_.resolveWalkablePosition(\n        character,\n        character.location.levelId,\n        target,\n        character.location.position.z,\n        defaults_.maxStepHeight,\n        defaults_.maxDropHeight,\n        supported\n      )) {\n        character.location.position = supported;'''
          new_snap = '''      Vec3 supported;\n      bool resolvedCrouching = false;\n      if (resolveCharacterPosition(\n        world_,\n        character,\n        target,\n        character.location.position.z,\n        defaults_,\n        supported,\n        resolvedCrouching\n      )) {\n        character.crouching = resolvedCrouching;\n        character.location.position = supported;'''
          replace('src/engine/character/CharacterSystem.cpp', old_snap, new_snap)

          old_step = '''    Vec3 supported;\n    if (!world_.resolveWalkablePosition(\n      character,\n      character.location.levelId,\n      proposed,\n      previous.z,\n      defaults_.maxStepHeight,\n      defaults_.maxDropHeight,\n      supported\n    )) {\n      character.location.position = previous;'''
          new_step = '''    Vec3 supported;\n    bool resolvedCrouching = false;\n    if (!resolveCharacterPosition(\n      world_,\n      character,\n      proposed,\n      previous.z,\n      defaults_,\n      supported,\n      resolvedCrouching\n    )) {\n      character.location.position = previous;'''
          replace('src/engine/character/CharacterSystem.cpp', old_step, new_step)
          replace(
              'src/engine/character/CharacterSystem.cpp',
              '''    character.location.position = supported;\n    refreshLiminalMembership(world_, character, liminalTolerance);\n    remaining -= step;''',
              '''    character.crouching = resolvedCrouching;\n    character.location.position = supported;\n    refreshLiminalMembership(world_, character, liminalTolerance);\n    remaining -= step;'''
          )

          # Demo authoring: 1.25U minimum storey, taller cutaway walls, more stair treads.
          replace(
              'src/demo/DemoWorld.cpp',
              '''constexpr float ROOM_SIZE = GROUND_LIMIT * 2.0f;\nconstexpr float ROOM_WALL_HEIGHT = 1.10f;\nconstexpr float ROOM_WALL_THICKNESS = 0.12f;''',
              '''constexpr float ROOM_SIZE = GROUND_LIMIT * 2.0f;\n// Demo-only authoring scale. The engine itself has no fixed storey height:\n// levels have arbitrary view origins and every Room owns its own wall height.\nconstexpr float DEMO_CHARACTER_HEIGHT = 1.65f;\nconstexpr float DEMO_MIN_STOREY_RATIO = 1.25f;\nconstexpr float DEMO_STOREY_HEIGHT = DEMO_CHARACTER_HEIGHT * DEMO_MIN_STOREY_RATIO;\nconstexpr float ROOM_WALL_HEIGHT = 1.80f;\nconstexpr float ROOM_WALL_THICKNESS = 0.12f;'''
          )
          replace(
              'src/demo/DemoWorld.cpp',
              '''constexpr int STAIR_STEP_COUNT = 7;\nconstexpr float STAIR_RISE = 1.40f;''',
              '''constexpr int STAIR_STEP_COUNT = 10;\nconstexpr float STAIR_RISE = DEMO_STOREY_HEIGHT;'''
          )
          replace(
              'src/demo/DemoWorld.cpp',
              '''  setLevelViewOrigin("lower", {0.0f, 0.0f, 0.0f});\n  setLevelViewOrigin("middle", {0.0f, 0.0f, STAIR_RISE});\n  setLevelViewOrigin("upper", {0.0f, 0.0f, STAIR_RISE * 2.0f});''',
              '''  setLevelViewOrigin("lower", {0.0f, 0.0f, 0.0f});\n  setLevelViewOrigin("middle", {0.0f, 0.0f, DEMO_STOREY_HEIGHT});\n  setLevelViewOrigin("upper", {0.0f, 0.0f, DEMO_STOREY_HEIGHT * 2.0f});'''
          )

          # WASM/JSON configuration for per-character crouched clearance.
          replace(
              'src/wasm/exports.cpp',
              '''extern "C" EMSCRIPTEN_KEEPALIVE int isoweb_character_is_moving(const char* id) {\n  const auto* character = application().character(text(id));\n  return character && character->moving ? 1 : 0;\n}\n''',
              '''extern "C" EMSCRIPTEN_KEEPALIVE int isoweb_character_is_moving(const char* id) {\n  const auto* character = application().character(text(id));\n  return character && character->moving ? 1 : 0;\n}\n\nextern "C" EMSCRIPTEN_KEEPALIVE int isoweb_character_is_crouching(const char* id) {\n  const auto* character = application().character(text(id));\n  return character && character->crouching ? 1 : 0;\n}\n'''
          )
          replace(
              'src/wasm/exports.cpp',
              '''extern "C" EMSCRIPTEN_KEEPALIVE int isoweb_set_character_speed(const char* id, float multiplier) {\n  auto* character = application().character(text(id));\n  if (!character) return 0;\n  character->movementSpeedMultiplier = multiplier;\n  return 1;\n}\n''',
              '''extern "C" EMSCRIPTEN_KEEPALIVE int isoweb_set_character_speed(const char* id, float multiplier) {\n  auto* character = application().character(text(id));\n  if (!character) return 0;\n  character->movementSpeedMultiplier = multiplier;\n  return 1;\n}\n\nextern "C" EMSCRIPTEN_KEEPALIVE int isoweb_set_character_crouched_height(const char* id, float height) {\n  auto* character = application().character(text(id));\n  if (!character) return 0;\n  character->crouchedHeight = std::max(0.0f, height);\n  if (!character->canCrouch()) character->crouching = false;\n  return 1;\n}\n'''
          )

          replace(
              'web/src/state/WorldStateLoader.ts',
              '''  movementSpeedMultiplier?: number;\n  collisionTags?: string[];''',
              '''  movementSpeedMultiplier?: number;\n  crouchedHeight?: number;\n  collisionTags?: string[];'''
          )
          replace(
              'web/src/state/WorldStateLoader.ts',
