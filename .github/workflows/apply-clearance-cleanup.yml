name: Apply clearance implementation cleanup
on:
  push:
    branches: [fix/storey-height-and-clearance]
    paths: [.github/workflows/apply-clearance-cleanup.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storey-height-and-clearance
      - name: Avoid transitive algorithm include
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/wasm/exports.cpp')
          s = p.read_text()
          old = '  character->crouchedHeight = std::max(0.0f, height);'
          new = '  character->crouchedHeight = height > 0.0f ? height : 0.0f;'
          if s.count(old) != 1:
              raise SystemExit('expected crouched-height assignment once')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wasm/exports.cpp
          git commit -m 'Avoid transitive include in crouch export'
          git push origin HEAD:fix/storey-height-and-clearance
