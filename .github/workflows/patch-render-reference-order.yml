name: Patch render reference order

on:
  push:
    branches:
      - perf/render-pipeline-parity
    paths:
      - scripts/patch-render-reference-order.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/render-pipeline-parity
          fetch-depth: 0
      - name: Apply exact reference-order correction
        run: python3 scripts/patch-render-reference-order.py
      - name: Commit correction and clean staging files
        run: |
          git config user.name "kitty"
          git config user.email "141717449+kitty-crow@users.noreply.github.com"
          git rm scripts/patch-render-reference-order.py .github/workflows/patch-render-reference-order.yml
          if [ -f .ci-render-trigger ]; then git rm .ci-render-trigger; fi
          git add src/engine/render/Renderer.cpp
          git commit -m "Restore reference preview order in single-thread renderer"
          git push origin HEAD:perf/render-pipeline-parity
