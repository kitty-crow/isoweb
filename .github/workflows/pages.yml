name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Pages template dependencies
        working-directory: vendor/pages
        run: |
          npm pkg set devDependencies.playwright=1.62.1
          bun install

      - name: Check Pages configuration
        run: bun run check

      - name: Build static site
        run: bun run build

      - name: Test world-object and character systems
        run: bun run test:hitboxes

      - name: Test unified world geometry
        run: bun run test:geometry

      - name: Test liminal spaces and runtime lighting
        run: bun run test:liminal

      - name: Test performance architecture
        run: bun run test:performance

      - name: Test Character face skin orientation
        run: bun run test:faces

      - name: Test Character destination feedback
        run: bun run test:destination-feedback

      - name: Test centre joystick quantisation
        run: bun run test:joystick

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache

      - name: Build DFPSR WebAssembly renderer
        run: bun run build:wasm

      - name: Check generated Emscripten bridge
        run: bun run check-emscripten-bridge

      - name: Install Chromium for browser checks
        working-directory: vendor/pages
        run: bunx playwright install --with-deps chromium

      - name: Smoke-test WASM browser boot
        run: bun run test:runtime

      - name: Exercise centre joysticks in Chromium
        run: bun run test:joystick-browser

      - name: Audit mobile responsiveness
        run: bun run audit:mobile

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
