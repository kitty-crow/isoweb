name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Pages template dependencies
        working-directory: vendor/pages
        run: |
          npm pkg set devDependencies.playwright=1.62.1
          bun install

      - name: Check Pages configuration
        run: bun run check

      - name: Test browser query-mode parser
        run: bun run test:query-modes

      - name: Test source world package round-trip and safety
        run: bun run test:world-package

      - name: Test editor source contract and project I/O
        run: bun run test:editor-source-contract

      - name: Test shared Editor Core
        run: bun run test:editor-core

      - name: Test Level Builder local authoring
        run: bun run test:level-builder-authoring

      - name: Test World Editor level management
        run: bun run test:world-editor-levels

      - name: Test World Editor portals and start level
        run: bun run test:world-editor-connectors

      - name: Test World Editor level composition
        run: bun run test:world-editor-composition

      - name: Compile demo deployment world
        run: bun run compile:demo-world

      - name: Test compiled world package pipeline
        run: bun run test:compiled-package

      - name: Prove world and level packages are self-contained
        run: bun run test:self-contained-packages

      - name: Build static site
        run: bun run build:site && bun run build:web

      - name: Test Level Builder and World Editor routes
        run: bun run test:editor-routes

      - name: Test world-object and character systems
        run: bun run test:hitboxes

      - name: Test unified world geometry
        run: bun run test:geometry

      - name: Test GPU static scene contract
        run: bun run test:gpu-static-scene

      - name: Test three-level Character routing
        run: bun run test:multilevel-routing

      - name: Test generic arbitrary-level Character routing
        run: bun run test:generic-multilevel-routing

      - name: Test Character collision and navigation reliability
        run: bun run test:character-reliability

      - name: Test moving obstacle hazards and routing
        run: bun run test:obstacles

      - name: Test liminal spaces and runtime lighting
        run: bun run test:liminal

      - name: Test performance architecture
        run: bun run test:performance

      - name: Test Character face skin orientation
        run: bun run test:faces

      - name: Test Character destination feedback
        run: bun run test:destination-feedback

      - name: Test centre joystick quantisation
        run: bun run test:joystick

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache

      - name: Build DFPSR WebAssembly renderer
        run: bun run build:wasm

      - name: Check generated Emscripten bridge
        run: bun run check:emscripten-bridge

      - name: Install Chromium for browser checks
        working-directory: vendor/pages
        run: bunx playwright install --with-deps chromium

      - name: Exercise graphical Level Builder authoring
        run: bun run test:editor-authoring-browser

      - name: Exercise World Editor composition
        run: bun run test:world-editor-browser

      - name: Smoke-test WASM browser boot
        run: bun run test:runtime

      - name: Prove package-authored dynamic behaviours
        run: bun run test:package-behaviours

      - name: Prove package assets require no external files
        run: bun run test:embedded-assets-browser

      - name: Prove packaged demo matches render goldens exactly
        run: bun run test:demo-package-parity

      - name: Prove WebGL2 presentation parity
        run: bun run test:webgl-presenter

      - name: Benchmark WebGL2 presentation
        run: bun run bench:webgl

      - name: Test progressive lower-preview loading
        run: bun run test:progressive-preview

      - name: Instrument three-way pan parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/joystick-browser-smoke.ts')
          text = path.read_text()
          text = text.replace(
              '    let retained: Uint8Array;\n    let full: Uint8Array;',
              '    let retained: Uint8Array;\n    let shiftedFull: Uint8Array;\n    let full: Uint8Array;'
          )
          needle = '''      retained = captured;
      captured = null;

      // Invalidate the static cache and redraw the exact same state from scratch.
      module._isoweb_set_render_thread_limit(1);'''
          replacement = '''      retained = captured;
      captured = null;

      // Force full scene recomposition without discarding the shifted static cache.
      module._isoweb_resize(canvas.width, canvas.height);
      module._isoweb_render();
      if (!captured) throw new Error('Shifted-static full renderer frame was not captured.');
      shiftedFull = captured;
      captured = null;

      // Then invalidate the static cache and redraw the exact same state from scratch.
      module._isoweb_set_render_thread_limit(1);'''
          if needle not in text:
              raise SystemExit('pan parity capture needle not found')
          text = text.replace(needle, replacement)
          old = '''    let mismatches = 0;
    let firstMismatch = -1;
    let maximumDelta = 0;
    for (let index = 0; index < retained.length; ++index) {
      const delta = Math.abs(retained[index] - full[index]);
      if (delta === 0) continue;
      ++mismatches;
      if (firstMismatch < 0) firstMismatch = index;
      maximumDelta = Math.max(maximumDelta, delta);
    }
    return { retainedCount, mismatches, firstMismatch, maximumDelta };'''
          new = '''    const compare = (a: Uint8Array, b: Uint8Array) => {
      let mismatches = 0;
      let mismatchPixels = 0;
      let firstMismatch = -1;
      let maximumDelta = 0;
      let minX = canvas.width;
      let minY = canvas.height;
      let maxX = -1;
      let maxY = -1;
      const byChannel = [0, 0, 0, 0];
      const seen = new Set<number>();
      const samples: any[] = [];
      for (let index = 0; index < a.length; ++index) {
        const delta = Math.abs(a[index] - b[index]);
        if (delta === 0) continue;
        ++mismatches;
        if (firstMismatch < 0) firstMismatch = index;
        maximumDelta = Math.max(maximumDelta, delta);
        const pixel = Math.floor(index / 4);
        const channel = index & 3;
        const x = pixel % canvas.width;
        const y = Math.floor(pixel / canvas.width);
        byChannel[channel]++;
        if (!seen.has(pixel)) {
          seen.add(pixel);
          ++mismatchPixels;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }
        if (samples.length < 12) samples.push({ x, y, channel, a: a[index], b: b[index], delta });
      }
      return { mismatches, mismatchPixels, firstMismatch, maximumDelta, minX, minY, maxX, maxY, byChannel, samples };
    };
    const retainedVsShifted = compare(retained, shiftedFull);
    const shiftedVsFresh = compare(shiftedFull, full);
    console.log('[pan-diagnostic] retained-vs-shifted-static-full', JSON.stringify(retainedVsShifted));
    console.log('[pan-diagnostic] shifted-static-full-vs-fresh-static-full', JSON.stringify(shiftedVsFresh));
    return {
      retainedCount,
      mismatches: retainedVsShifted.mismatches,
      firstMismatch: retainedVsShifted.firstMismatch,
      maximumDelta: retainedVsShifted.maximumDelta,
      retainedVsShifted,
      shiftedVsFresh
    };'''
          if old not in text:
              raise SystemExit('pan parity compare needle not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Exercise centre joysticks in Chromium
        run: bun run test:joystick-browser

      - name: Audit mobile responsiveness
        run: bun run audit:mobile

      - name: Prepare threaded browser test site
        run: cp -R site site-threaded

      - name: Build pthread WebAssembly renderer
        run: ISOWEB_PTHREADS=1 ISOWEB_OUTPUT_ROOT=site-threaded bun run build:wasm

      - name: Prove pthread rendering in Chromium
        run: bun run test:pthreads

      - name: Prove adaptive GPU MT ST hierarchy
        run: bun run test:adaptive-render

      - name: Package query-selected runtime artefacts
        run: |
          rm -rf site/assets/threaded
          mkdir -p site/assets/threaded
          cp site-threaded/assets/isoweb* site/assets/threaded/
          bun run package:query-compat

      - name: Prove root query-mode renderer matrix
        run: bun run test:query-pages

      - name: Test stats overlay in ST MT GPU modes
        run: bun run test:stats

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
