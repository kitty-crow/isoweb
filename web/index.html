<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1720">
  <title>isoweb · DFPSR WebAssembly</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="scene" aria-label="Interactive isometric ray-traced scene">
    <div id="viewport" class="viewport">
      <canvas
        id="canvas"
        width="512"
        height="288"
        role="img"
        aria-label="A ray-traced isometric scene containing a blue cube and an orange sphere on a tiled ground plane, with physically derived lighting and cast shadows."
      ></canvas>

      <button id="zoom-in" class="control-hitbox" type="button" aria-label="Zoom in" disabled></button>
      <button id="reset-zoom" class="control-hitbox" type="button" aria-label="Reset zoom to 1x" disabled></button>
      <button id="rotate-counterclockwise" class="control-hitbox" type="button" aria-label="Rotate camera 45 degrees counter-clockwise around the Z axis" disabled></button>
      <button id="reset-yaw" class="control-hitbox" type="button" aria-label="Reset camera yaw to 0 degrees" disabled></button>
      <button id="rotate-clockwise" class="control-hitbox" type="button" aria-label="Rotate camera 45 degrees clockwise around the Z axis" disabled></button>
      <button id="zoom-out" class="control-hitbox" type="button" aria-label="Zoom out" disabled></button>

      <button id="pan-up" class="control-hitbox" type="button" aria-label="Pan camera up along the X axis" disabled></button>
      <button id="pan-down" class="control-hitbox" type="button" aria-label="Pan camera down along the X axis" disabled></button>
      <button id="pan-left" class="control-hitbox" type="button" aria-label="Pan camera left along the Y axis" disabled></button>
      <button id="pan-right" class="control-hitbox" type="button" aria-label="Pan camera right along the Y axis" disabled></button>
      <button id="reset-camera" class="control-hitbox" type="button" aria-label="Reset camera X and Y position to centre" disabled></button>
    </div>

    <div id="loading" class="loading" role="status" aria-live="polite">Rendering C++ / WASM…</div>
    <div id="view-status" class="visually-hidden" role="status" aria-live="polite">Camera view 0 degrees around Z</div>

    <div class="badge" aria-hidden="true">
      <strong>isoweb</strong>
      <span>DFPSR · C++ · WASM · ray cast</span>
    </div>
  </main>

  <script src="./assets/bootstrap.js"></script>
  <script src="./assets/isoweb.js"></script>
</body>
</html>
