<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1720">
  <title>isoweb · DFPSR WebAssembly</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="scene" aria-label="Interactive isometric ray-traced scene">
    <div id="viewport" class="viewport">
      <canvas
        id="canvas"
        width="512"
        height="288"
        role="img"
        aria-label="A ray-traced isometric scene containing a blue cube and an orange sphere on a tiled ground plane, with physically derived lighting and cast shadows."
      ></canvas>

      <button
        id="rotate-counterclockwise"
        class="control-hitbox"
        type="button"
        aria-label="Rotate camera 90 degrees counter-clockwise around the Z axis"
        disabled
      ></button>
      <button
        id="rotate-clockwise"
        class="control-hitbox"
        type="button"
        aria-label="Rotate camera 90 degrees clockwise around the Z axis"
        disabled
      ></button>

      <button
        id="pan-up"
        class="control-hitbox"
        type="button"
        aria-label="Pan camera up along the projected Y axis"
        disabled
      ></button>
      <button
        id="pan-down"
        class="control-hitbox"
        type="button"
        aria-label="Pan camera down along the projected Y axis"
        disabled
      ></button>
      <button
        id="pan-left"
        class="control-hitbox"
        type="button"
        aria-label="Pan camera left along the horizontal X axis"
        disabled
      ></button>
      <button
        id="pan-right"
        class="control-hitbox"
        type="button"
        aria-label="Pan camera right along the horizontal X axis"
        disabled
      ></button>
      <button
        id="reset-camera"
        class="control-hitbox"
        type="button"
        aria-label="Reset camera X and Y position to centre"
        disabled
      ></button>
    </div>

    <div id="loading" class="loading" role="status" aria-live="polite">Rendering C++ / WASM…</div>
    <div id="view-status" class="visually-hidden" role="status" aria-live="polite">Camera view 0 degrees around Z</div>

    <div class="badge" aria-hidden="true">
      <strong>isoweb</strong>
      <span>DFPSR · C++ · WASM · ray cast</span>
    </div>
  </main>

  <script>
    var Module = {
      onRuntimeInitialized: function () {
        const viewport = document.getElementById('viewport');
        const controls = Array.from(document.querySelectorAll('.control-hitbox'));
        const counterClockwise = document.getElementById('rotate-counterclockwise');
        const clockwise = document.getElementById('rotate-clockwise');
        const panUp = document.getElementById('pan-up');
        const panDown = document.getElementById('pan-down');
        const panLeft = document.getElementById('pan-left');
        const panRight = document.getElementById('pan-right');
        const resetCamera = document.getElementById('reset-camera');

        const ROTATE_ARROW_WIDTH = 56;
        const ROTATE_ARROW_HEIGHT = 44;
        const ROTATE_LEFT_X = 18;
        const ROTATE_GAP = 10;
        const CONTROL_BOTTOM = 18;

        const PAN_ARROW_SIZE = 38;
        const PAN_X_STEP = 48;
        const PAN_Y_STEP = 36;
        const PAN_PAD_RIGHT = 18;
        const PAN_PAD_BOTTOM = 16;

        const PAN_BUTTON_STEP = 0.34;
        const BASE_VIEW_HEIGHT = 6.15;
        const MIN_VIEW_WIDTH = 5.50;
        const MAX_RENDER_PIXELS = 360000;

        let renderWidth = 512;
        let renderHeight = 288;
        let resizeFrame = 0;
        let pendingPanX = 0;
        let pendingPanY = 0;
        let panFrame = 0;
        let pointerId = null;
        let pointerX = 0;
        let pointerY = 0;

        function chooseRenderSize(cssWidth, cssHeight) {
          const safeWidth = Math.max(160, Math.round(cssWidth));
          const safeHeight = Math.max(160, Math.round(cssHeight));
          const pixels = safeWidth * safeHeight;
          const scale = pixels > MAX_RENDER_PIXELS
            ? Math.sqrt(MAX_RENDER_PIXELS / pixels)
            : 1;

          return {
            width: Math.max(160, Math.round(safeWidth * scale)),
            height: Math.max(160, Math.round(safeHeight * scale))
          };
        }

        function setHitbox(control, renderX, renderY, renderW, renderH, minCssSize) {
          const rect = viewport.getBoundingClientRect();
          const scaleX = rect.width / renderWidth;
          const scaleY = rect.height / renderHeight;

          let left = renderX * scaleX;
          let top = renderY * scaleY;
          let width = renderW * scaleX;
          let height = renderH * scaleY;

          if (width < minCssSize) {
            left -= (minCssSize - width) * 0.5;
            width = minCssSize;
          }
          if (height < minCssSize) {
            top -= (minCssSize - height) * 0.5;
            height = minCssSize;
          }

          control.style.left = left + 'px';
          control.style.top = top + 'px';
          control.style.width = width + 'px';
          control.style.height = height + 'px';
        }

        function positionControls() {
          const rotateTop = renderHeight - CONTROL_BOTTOM - ROTATE_ARROW_HEIGHT;
          const clockwiseX = ROTATE_LEFT_X + ROTATE_ARROW_WIDTH + ROTATE_GAP;

          setHitbox(
            counterClockwise,
            ROTATE_LEFT_X,
            rotateTop,
            ROTATE_ARROW_WIDTH,
            ROTATE_ARROW_HEIGHT,
            44
          );
          setHitbox(
            clockwise,
            clockwiseX,
            rotateTop,
            ROTATE_ARROW_WIDTH,
            ROTATE_ARROW_HEIGHT,
            44
          );

          // Reset disk is the origin of the visual X/Y axis control.
          // X is horizontal, while Y is the diagonal isometric ground axis.
          const centreX = renderWidth - PAN_PAD_RIGHT - PAN_ARROW_SIZE - PAN_X_STEP;
          const centreY = renderHeight - PAN_PAD_BOTTOM - PAN_ARROW_SIZE - PAN_Y_STEP;

          setHitbox(
            panLeft,
            centreX - PAN_X_STEP,
            centreY,
            PAN_ARROW_SIZE,
            PAN_ARROW_SIZE,
            44
          );
          setHitbox(
            resetCamera,
            centreX,
            centreY,
            PAN_ARROW_SIZE,
            PAN_ARROW_SIZE,
            44
          );
          setHitbox(
            panRight,
            centreX + PAN_X_STEP,
            centreY,
            PAN_ARROW_SIZE,
            PAN_ARROW_SIZE,
            44
          );
          setHitbox(
            panUp,
            centreX + PAN_Y_STEP,
            centreY - PAN_Y_STEP,
            PAN_ARROW_SIZE,
            PAN_ARROW_SIZE,
            44
          );
          setHitbox(
            panDown,
            centreX - PAN_Y_STEP,
            centreY + PAN_Y_STEP,
            PAN_ARROW_SIZE,
            PAN_ARROW_SIZE,
            44
          );
        }

        function syncRendererSize() {
          const rect = viewport.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;

          const size = chooseRenderSize(rect.width, rect.height);
          renderWidth = size.width;
          renderHeight = size.height;
          positionControls();
          Module._isoweb_resize(renderWidth, renderHeight);
        }

        function scheduleResize() {
          if (resizeFrame) return;
          resizeFrame = requestAnimationFrame(function () {
            resizeFrame = 0;
            syncRendererSize();
          });
        }

        function viewHeightWorld() {
          const aspect = renderWidth / renderHeight;
          return Math.max(BASE_VIEW_HEIGHT, MIN_VIEW_WIDTH / aspect);
        }

        function pixelsToWorld(pixels) {
          const rect = viewport.getBoundingClientRect();
          if (rect.height <= 0) return 0;
          return pixels * (viewHeightWorld() / rect.height);
        }

        function queuePan(screenRight, screenDown) {
          pendingPanX += screenRight;
          pendingPanY += screenDown;
          if (panFrame) return;

          panFrame = requestAnimationFrame(function () {
            const x = pendingPanX;
            const y = pendingPanY;
            pendingPanX = 0;
            pendingPanY = 0;
            panFrame = 0;
            if (x !== 0 || y !== 0) {
              Module._isoweb_pan(x, y);
            }
          });
        }

        counterClockwise.addEventListener('click', function () {
          Module._isoweb_rotate_counterclockwise();
        });

        clockwise.addEventListener('click', function () {
          Module._isoweb_rotate_clockwise();
        });

        // These calls are intentionally unchanged. Only the visual layout of
        // the Y pair is diagonal. D-pad Y remains opposite to wheel scrolling.
        panUp.addEventListener('click', function () {
          queuePan(0, PAN_BUTTON_STEP);
        });

        panDown.addEventListener('click', function () {
          queuePan(0, -PAN_BUTTON_STEP);
        });

        panLeft.addEventListener('click', function () {
          queuePan(-PAN_BUTTON_STEP, 0);
        });

        panRight.addEventListener('click', function () {
          queuePan(PAN_BUTTON_STEP, 0);
        });

        resetCamera.addEventListener('click', function () {
          Module._isoweb_reset_camera();
        });

        viewport.addEventListener('wheel', function (event) {
          event.preventDefault();

          const rect = viewport.getBoundingClientRect();
          let delta = event.deltaY;
          if (event.deltaMode === WheelEvent.DOM_DELTA_LINE) {
            delta *= 16;
          } else if (event.deltaMode === WheelEvent.DOM_DELTA_PAGE) {
            delta *= rect.height;
          }

          const worldDelta = pixelsToWorld(delta) * 0.35;
          if (event.ctrlKey) {
            queuePan(worldDelta, 0);
          } else {
            queuePan(0, worldDelta);
          }
        }, { passive: false });

        viewport.addEventListener('pointerdown', function (event) {
          if (event.pointerType === 'mouse' || event.target.closest('button')) return;
          pointerId = event.pointerId;
          pointerX = event.clientX;
          pointerY = event.clientY;
          viewport.setPointerCapture(pointerId);
        });

        viewport.addEventListener('pointermove', function (event) {
          if (event.pointerId !== pointerId) return;

          const dx = event.clientX - pointerX;
          const dy = event.clientY - pointerY;
          pointerX = event.clientX;
          pointerY = event.clientY;

          // Touch acts like dragging a map: the rendered world follows the finger.
          queuePan(-pixelsToWorld(dx), -pixelsToWorld(dy));
        });

        function endPointer(event) {
          if (event.pointerId !== pointerId) return;
          pointerId = null;
        }

        viewport.addEventListener('pointerup', endPointer);
        viewport.addEventListener('pointercancel', endPointer);

        window.addEventListener('resize', scheduleResize);
        window.addEventListener('orientationchange', scheduleResize);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', scheduleResize);
        }

        const observer = new ResizeObserver(scheduleResize);
        observer.observe(viewport);

        syncRendererSize();
        controls.forEach(function (control) {
          control.disabled = false;
        });
      }
    };
  </script>
  <script src="./assets/isoweb.js"></script>
</body>
</html>
