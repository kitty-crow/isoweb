<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <base href="../">
  <meta name="theme-color" content="#0f1720">
  <title>World Editor · IsoWeb</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/editor.css">
</head>
<body class="editor-page">
  <div class="editor-root">
    <header class="editor-toolbar" aria-label="World Editor toolbar">
      <div class="editor-title">
        <strong id="editor-product">World Editor</strong>
        <span id="editor-project-title">Untitled</span>
      </div>
      <button id="editor-new" type="button">New</button>
      <button id="editor-open" type="button">Open</button>
      <button id="editor-save" type="button">Save</button>
      <button id="editor-undo" type="button" disabled>Undo</button>
      <button id="editor-redo" type="button" disabled>Redo</button>
      <select id="editor-add-kind" aria-label="Object type to add">
        <option value="ground">Ground</option>
        <option value="cube">Cube</option>
        <option value="sphere">Sphere</option>
        <option value="cone">Cone</option>
        <option value="pyramid">Pyramid</option>
        <option value="dodecahedron">Dodecahedron</option>
        <option value="icosahedron">Icosahedron</option>
        <option value="room">Room</option>
        <option value="character">Character</option>
        <option value="dynamic-body">Dynamic body</option>
        <option value="spawn">Spawn</option>
        <option value="connector">Connector</option>
        <option value="light">Point light</option>
      </select>
      <button id="editor-add" type="button">Add</button>
      <button id="editor-duplicate" type="button" disabled>Duplicate</button>
      <button id="editor-delete" type="button" disabled>Delete</button>
      <input id="editor-open-file" class="visually-hidden-editor" type="file" accept=".isoworld">
    </header>

    <main class="editor-workspace">
      <aside class="editor-panel editor-hierarchy-panel" aria-label="Hierarchy">
        <div class="editor-panel-header">
          <h2>Hierarchy</h2>
          <div class="editor-hierarchy-tools">
            <input id="editor-hierarchy-search" type="search" placeholder="Search" aria-label="Search hierarchy">
            <select id="editor-hierarchy-filter" aria-label="Filter hierarchy by type">
              <option value="all">All</option>
              <option value="level">Levels</option>
              <option value="ground">Ground</option>
              <option value="entity">Entities</option>
              <option value="geometry">Geometry</option>
              <option value="room">Rooms</option>
              <option value="spawn">Spawns</option>
              <option value="connector">Connectors</option>
              <option value="light">Lights</option>
              <option value="material">Materials</option>
              <option value="prefab">Prefabs</option>
            </select>
          </div>
        </div>
        <div id="editor-hierarchy" class="editor-tree"></div>
      </aside>

      <section class="editor-stage" aria-label="Editor viewport workspace">
        <div class="editor-stage-card">
          <h1>World Editor</h1>
          <p>The source document below is authoritative. Runtime preview will be attached to this shared core through the existing IsoWeb engine, not a second editor renderer.</p>
          <div id="editor-overview" class="editor-overview" aria-label="Project summary"></div>
        </div>
      </section>

      <aside class="editor-panel editor-inspector-panel" aria-label="Inspector">
        <div class="editor-panel-header"><h2>Inspector</h2></div>
        <div id="editor-inspector" class="editor-inspector"></div>
      </aside>
    </main>

    <footer class="editor-problems-panel" aria-live="polite">
      <h2>Problems</h2>
      <div id="editor-problems" class="editor-problems"></div>
    </footer>
  </div>
  <script src="assets/world-editor.js"></script>
</body>
</html>
